services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../backend/app:/code/app
      - ../backend/seed.py:/code/seed.py
      - static_files:/code/static # Aligned path
    networks:
      - frontend
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - static_files:/code/static:ro # Aligned path
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    env_file:
      - ../.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tester:
    build: 
      context: ../backend
      dockerfile: tests.Dockerfile
    environment:
      - BACKEND_URL=http://app:8000
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

volumes:
  mongo_data:
  static_files:

networks:
  frontend:
  backend:
