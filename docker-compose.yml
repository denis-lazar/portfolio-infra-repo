services:
  app:
    image: ${APP_IMAGE_NAME}:${APP_IMAGE_TAG}
    restart: always 
    env_file:
      - ${ENV_FILE:-.env}

    volumes:
      - static_files:/code/static 
    networks:
      - frontend
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_files:/code/static:ro # Aligned path
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy

  mongodb:
    image: mongo:latest
    restart: always
    env_file:
      - ${ENV_FILE:-.env}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  tester:
    build: 
      context: ./backend
      dockerfile: tests.Dockerfile
    environment:
      - BACKEND_URL=http://app:8000
      - NGINX_URL=http://nginx:80
    networks:
      - frontend
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - test

volumes:

  mongo_data:

  static_files:



networks:

  frontend:

  backend:
