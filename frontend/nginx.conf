upstream monolith_servers {
    server app:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # The shared volume is mounted here
    root /code/static;
    index index.html;

    # 1. API & Docs Requests
    location /api/v1 {
        proxy_pass http://monolith_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
    }

    location ^~ /docs {
        proxy_pass http://monolith_servers/docs;
        proxy_set_header Host $host;
    }

    location ^~ /redoc {
        proxy_pass http://monolith_servers/redoc;
        proxy_set_header Host $host;
    }

    location ^~ /openapi.json {
        proxy_pass http://monolith_servers/openapi.json;
        proxy_set_header Host $host;
    }

    # 2. Prometheus Metrics
    location /metrics {
        proxy_pass http://monolith_servers/api/v1/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. Static Assets (Images, JS, CSS)
    # We try to serve them directly from the volume
    location /images/ {
        try_files $uri =404;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # 4. Main Application (React SPA)
    location / {
        # Only serve index.html for the root path. 
        # For an actual SPA with sub-routes, you would list them here or in a regex.
        try_files $uri $uri/ =404;
    }

    # If you later add React Router paths like /profile, add them here:
    # location ~ ^/(profile|map|detail) {
    #     try_files $uri /index.html;
    # }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}