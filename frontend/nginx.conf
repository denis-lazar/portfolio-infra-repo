upstream monolith_servers {
    server app:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # The shared volume is mounted here
    root /code/static;
    index index.html;

    # 1. API Requests (CRITICAL: These must be proxied, not served as files)
    location /api/v1 {
        proxy_pass http://monolith_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Long timeouts for WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Prometheus Metrics
    location /metrics {
        proxy_pass http://monolith_servers/api/v1/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. Static Assets (Images, JS, CSS)
    # We try to serve them directly from the volume
    location /images/ {
        try_files $uri =404;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    # 4. Main Application (React SPA)
    location / {
        # Check if the file exists in volume, otherwise fallback to index.html for React routing
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}